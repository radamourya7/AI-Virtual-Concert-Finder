<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Aesthetic Concert Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #2c3e50;
    }

    .calendar-container {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      max-width: 1000px;
      margin: 50px auto;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .calendar-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3em;
      text-align: center;
      margin-bottom: 20px;
      color: #34495e;
    }

    #calendar {
      margin-top: 20px;
    }

    .button-container {
      text-align: center;
      margin-top: 20px;
    }

    .clear-button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .clear-button:hover {
      background-color: #c0392b;
    }

    @media (max-width: 768px) {
      .calendar-container {
        margin: 20px;
        padding: 20px;
      }
      .calendar-title {
        font-size: 2.2em;
      }
      .clear-button {
        width: 100%;
        padding: 14px;
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {
      .calendar-title {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="calendar-container">
    <h1 class="calendar-title">My Aesthetic Concert Calendar</h1>
    <div id="calendar"></div>
    <div class="button-container">
      <button class="clear-button" onclick="clearCalendar()">Clear Calendar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script>
    let calendar;

    document.addEventListener('DOMContentLoaded', () => {
      const savedEvents = JSON.parse(localStorage.getItem('concertEvents')) || [];

      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        events: savedEvents.map(e => ({
          title: e.title,
          start: e.date,
          description: e.location
        })),
        eventClick: function(info) {
          alert(info.event.title + "\n" + info.event.extendedProps.description);
        }
      });

      calendar.render();
    });

    function clearCalendar() {
      if (confirm("Are you sure you want to clear all saved concerts?")) {
        localStorage.removeItem('concertEvents');
        calendar.removeAllEvents();
        alert("All concerts have been cleared.");
      }
    }
  </script>
</body>
</html>
